services:
  backend:
    build: ./compliance_multi_agent
    ports:
      - "8001:8000"
    env_file:
      - ./compliance_multi_agent/.env
    environment:
      # Container-internal path; the real key lives on the host (see GCP_KEY_PATH below).
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
    volumes:
      - ${GCP_KEY_PATH:-/Users/sathwikmarupaka/Desktop/portfolio-507415-0f625449c5af.json}:/secrets/service-account.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
